name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          f=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n1)
          cd "$(dirname "$f")"
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/HoopsLive-debug.apk"
          ./gradlew --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/out/HoopsLive.apk" || echo "Release build failed, debug APK still available"
      - uses: actions/upload-artifact@v4
        with:
          name: HoopsLive-apk
          path: out/*.apk
